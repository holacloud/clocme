# Everything runs inside docker; data and configuration live on the host.
#
#   make up        # creates config.json from config.example.json if missing, builds, starts
#   make restart   # apply config.json changes (recreates the container, no rebuild)
#   make logs / make down
#
# App configuration goes in config.json (read by goconfig from the working
# directory). Do not add an `environment:` block for app settings here:
# environment variables take precedence over config.json and would silently
# override it. Optional docker-side settings (PORT, DATA_DIR, CONFIG_FILE)
# can go in .env.
services:
  clocme:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: clocme:${VERSION:-dev}
    container_name: clocme
    restart: unless-stopped
    # Run with the host user so files in the data dir stay owned by you.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${PORT:-7070}:8080"
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${CONFIG_FILE:-./config.json}:/app/config.json:ro
